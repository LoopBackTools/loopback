linter:
  extends:
    - "typespec-hono/recommended"
emit:
  - typespec-hono
  - typespec-http-mcp
options:
  # Both emitters write the same validators into one directory, from the same options, so one set of
  # them serves the routes and the tools.
  typespec-hono:
    emitter-output-dir: "{project-root}/src/generated"
    contracts-package: "@loopbacktools/protocol"
    seal-object-schemas: true
    regenerate-hint: "pnpm generate"
  typespec-http-mcp:
    emitter-output-dir: "{project-root}/src/generated"
    contracts-package: "@loopbacktools/protocol"
    seal-object-schemas: true
    regenerate-hint: "pnpm generate"
    # Only what an agent does is a tool; the inbox's operations are for people.
    tool-tags:
      - Agent
  # The contract is published as OpenAPI 3.1, which says null; the validators follow it.
  "@typespec/openapi3":
    openapi-versions:
      - "3.1.0"
