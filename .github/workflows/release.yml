name: release

# Publishes the packages to npm when a version tag is pushed, after the same checks as CI. Each
# package carries provenance saying which commit and run built it.
#
# npm can only trust this workflow for a package that already exists, so the first release publishes
# with the NPM_TOKEN secret. Once each package is on npm: add this workflow as its trusted publisher
# (trusted publishing over OIDC), remove NODE_AUTH_TOKEN below, and delete the secret and the token.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The tag names the packages' version
        run: |
          for manifest in packages/*/package.json; do
            version=$(node -p "require('./$manifest').version")
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "$manifest is $version, not $GITHUB_REF_NAME"; exit 1; }
          done
      - run: pnpm generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm -r --filter "./packages/*" publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
