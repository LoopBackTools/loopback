emit:
  - typespec-http-zod
  - "@typespec/openapi3"
  - typespec-openapi-document
options:
  typespec-http-zod:
    # The contract's framework-free types, which clients and the core import, go in src/generated.
    # The library writes its zod validators too, whatever it is asked: nothing here publishes or
    # imports them, so they go in the package's cache. Each edge compiles this spec with its own
    # server and tool emitters, and generates the validators it serves with.
    emitter-output-dir: "{project-root}/node_modules/.cache/typespec-http-zod"
    contracts-output-dir: "{project-root}/src/generated"
    seal-object-schemas: true
    regenerate-hint: "pnpm generate"
  "@typespec/openapi3":
    emitter-output-dir: "{project-root}/openapi"
    file-type: json
    openapi-versions:
      - "3.1.0"
    seal-object-schemas: true
  typespec-openapi-document:
    # Beside the document it imports, so the module and the JSON ship in one package.
    emitter-output-dir: "{project-root}/src/generated"
